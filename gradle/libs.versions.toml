[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
lalrpopUtil = "0.1.1"
starlarkmap = "0.1.3"
anyhow = "0.1.1"
logos = "0.2.0"
onceCell = "0.1.1"
thiserror = "0.2.1"
deriveMore = "0.1.0"
libc = "0.1.9"
serde = "0.1.11"
serdeJson = "0.1.1"
kmIo = "0.1.5"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
lalrpop-util = { module = "io.github.kotlinmania:lalrpop-util-kotlin", version.ref = "lalrpopUtil" }
starlarkmap = { module = "io.github.kotlinmania:starlarkmap-kotlin", version.ref = "starlarkmap" }
anyhow = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
logos = { module = "io.github.kotlinmania:logos-kotlin", version.ref = "logos" }
once-cell = { module = "io.github.kotlinmania:once-cell-kotlin", version.ref = "onceCell" }
thiserror = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
derive-more = { module = "io.github.kotlinmania:derive-more-kotlin", version.ref = "deriveMore" }
libc = { module = "io.github.kotlinmania:libc-kotlin", version.ref = "libc" }
serde = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
km-io = { module = "io.github.kotlinmania:km-io", version.ref = "kmIo" }

[bundles]
starlark-syntax-kotlin-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "lalrpop-util",
  "starlarkmap",
  "anyhow",
  "logos",
  "once-cell",
  "thiserror",
  "derive-more",
  "libc",
  "serde",
  "serde-json",
  "km-io",
]
